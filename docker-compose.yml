services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    command: npm run worker
    init: true
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # Scrape worker. Terms-safe only: honest User-Agent, robots.txt, no stealth/headed/proxy/FlareSolverr
  # (retired 2026-10-09, see lib/scrapers/retired.ts). A site that blocks us is skipped, not bypassed.
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    restart: unless-stopped
    init: true
    shm_size: "1gb" # Chrome needs ample /dev/shm or it crashes under load
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SCRAPE_INTERVAL_MS=1800000
      - LOCAL_CACHE_PATH=/app/cache
      # Redis for optional AI parse queue (producer enqueues; invent consumer stays disabled).
      - REDIS_URL=redis://redis:6379
      # Micro-AI dealer producer — OFF by default. Uncomment to enqueue curated VDPs.
      # Invent consumer remains disabled in workers/scrape-worker.ts; do not re-enable lightly.
      # - ENABLE_AI_DEALER_CRAWL=1
      # - AI_CRAWL_SITES_MAX=8
      # - AI_CRAWL_VDP_CAP=12
      # - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./cache:/app/cache


  # Disk janitor for ./cache (Zeus volume). Age-based deletes in named subfolders only; the scraper's
  # state files are never touched. See scripts/zeus-janitor.sh and docs/RETENTION.md.
  janitor:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      - JANITOR_INTERVAL_HOURS=24
    volumes:
      - ./cache:/cache
      - ./scripts/zeus-janitor.sh:/janitor.sh:ro
    command: ["sh", "/janitor.sh", "--loop"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

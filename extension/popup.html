<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>DealerHunt Pro</title>
  <style>
    body { width: 300px; padding: 16px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #14101a; color: #e5e7eb; margin: 0; }
    h2 { margin: 0 0 10px; color: #fff; font-size: 17px; display: flex; align-items: center; gap: 8px; }
    .badge { background: linear-gradient(135deg,#ff7a4d,#f25b9a 55%,#9b6bff); width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
    label { display: block; font-size: 11px; color: #9ca3af; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; background: #0c0810; border: 1px solid #2a2233; border-radius: 8px; color: #fff; font-size: 13px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 12px; color: #fff; }
    .primary { background: linear-gradient(135deg,#ff7a4d,#f25b9a 55%,#9b6bff); }
    .ghost { background: #251d2e; }
    .status { margin-top: 12px; font-size: 12px; text-align: center; color: #9ca3af; min-height: 16px; }
    .row { display:flex; gap:8px; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 6px; }
  </style>
</head>
<body>
  <h2><span class="badge"></span> DealerHunt Pro</h2>

  <label>API URL</label>
  <input id="apiBase" placeholder="https://your-app.vercel.app" />
  <label>Ingest secret (INGEST_SECRET)</label>
  <input id="ingestSecret" type="password" placeholder="required in production" />
  <button id="saveBtn" class="ghost">Save settings</button>

  <button id="scrapeBtn" class="primary">⚡ Send this page</button>
  <div id="status" class="status">Open a car listing, then send.</div>
  <div class="hint">Or use the floating button on any supported listing.</div>

  <script src="popup.js"></script>
</body>
</html>

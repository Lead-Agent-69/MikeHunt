services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    command: ["sh", "scripts/start-scraper-local.sh"]
    init: true
    restart: unless-stopped
    shm_size: 1gb
    cpus: 3.0
    mem_limit: 4g
    env_file:
      - path: .env.local
        required: false
      - path: .env.local.scraper
        required: false
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      LOCAL_CACHE_PATH: /app/cache
      BROWSER_PROFILE_DIR: /app/profiles
      STATUS_PATH: /app/logs/status.json
      SCRAPER_LOG_PATH: /app/logs/scraper.log
      STATUS_PORT: 8787
      # hybrid = buyer-scoped queue first, broad state sweep while the queue is idle.
      SCRAPER_EXECUTION_MODE: "${SCRAPER_EXECUTION_MODE:-hybrid}"
      SWEEP_INTERVAL_HOURS: "${SWEEP_INTERVAL_HOURS:-4}"
      CACHE_ONLY_MODE: "${CACHE_ONLY_MODE:-false}"
      REMOTE_QUEUE_POLL_MS: "${REMOTE_QUEUE_POLL_MS:-5000}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./cache:/app/cache
      - ./profiles:/app/profiles
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - scraper-local
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/status.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # Disk janitor for ./cache on Zeus: age-based deletes in named subfolders only; the scraper's
  # state files are never touched. See scripts/zeus-janitor.sh and docs/RETENTION.md.
  janitor:
    # Prefer an image already cached on Zeus (Docker Desktop credential-store breaks
    # `docker pull alpine:3.20` over SSH). redis:7-alpine is pulled with the stack and has /bin/sh.
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      JANITOR_INTERVAL_HOURS: "24"
    volumes:
      - ./cache:/cache
      - ./scripts/zeus-janitor.sh:/janitor.sh:ro
    command: ["sh", "/janitor.sh", "--loop"]
    networks:
      - scraper-local

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-local-data:/data
    networks:
      - scraper-local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  scraper-local:
    driver: bridge

volumes:
  redis-local-data:

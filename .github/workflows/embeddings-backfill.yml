# Embeddings backfill — moved OFF Vercel cron.
#
# Why: vercel.json had 3 daily crons, but the Vercel Hobby plan allows a maximum of 2, so the
# third was rejected on deploy. The two alert jobs are user-facing (price drops, profit sniper)
# and must stay; this one is an incremental enrichment job (embed deals that lack a vector) and
# belongs on a scheduler that isn't rate-limited.
#
# The endpoint is unchanged: GET /api/embeddings/backfill is gated by isAuthorizedCron, which
# accepts `Authorization: Bearer <CRON_SECRET>` — the same header Vercel Cron sends, and the same
# one lib/cron-auth.ts documents for GitHub Actions.

name: Embeddings backfill

on:
  schedule:
    # Every 3h (8 runs/day). The endpoint caps each run at 250 texts and each PT day at
    # EMBEDDING_DAILY_CAP (default 900, under the Gemini free tier's 1,000 requests/day), so
    # extra runs only pick up newly scraped/changed deals; once the day's cap is spent a run
    # returns in seconds. Runs on the self-hosted Zeus runner, so it uses no hosted Actions minutes.
    - cron: "17 */3 * * *"
  workflow_dispatch: # manual re-run from the Actions tab
    inputs:
      limit:
        description: "Deals to embed this run (max 250; daily cap still applies)"
        required: false
        default: "250"

concurrency:
  group: embeddings-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - name: Trigger backfill
        # Zeus self-hosted runners are Windows services (NetworkService) with no WSL distro, so a
        # bare `shell: bash` resolves to WSL's bash.exe and dies. Built-in Windows PowerShell 5.1 +
        # curl.exe (ships with Windows 10+) needs nothing extra installed — same as ci.yml's `cmd`.
        shell: powershell
        env:
          # Real Vercel project is team/project mikehunt/mikehunt (NOT mikehunt-69).
          # Production deploy URLs look like https://mikehunt-<id>-mikehunt.vercel.app and may rotate;
          # set repo secret SITE_URL to the stable production domain/alias from
          # https://vercel.com/mikehunt/mikehunt/settings/domains (do not use preview URLs).
          BASE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '250' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CRON_SECRET)) {
            Write-Output "::error::CRON_SECRET repo secret is not set - the endpoint fails closed with 401."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            Write-Output "::error::SITE_URL repo secret is not set - set it to the mikehunt/mikehunt production domain from Vercel Domains (not mikehunt-69, not a preview URL)."
            exit 1
          }
          $base = $env:BASE_URL.TrimEnd('/')
          $out = Join-Path $env:RUNNER_TEMP 'backfill.json'
          Write-Output "Calling backfill on $base (limit=$($env:LIMIT))"
          $code = & curl.exe -sS -o $out -w "%{http_code}" --max-time 300 `
            -H "Authorization: Bearer $($env:CRON_SECRET)" `
            "$base/api/embeddings/backfill?limit=$($env:LIMIT)"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::curl failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Output "HTTP $code"
          if (Test-Path $out) { Get-Content $out -Raw | Write-Output }
          if ("$code".Trim() -ne '200') {
            Write-Output "::error::Backfill returned $code"
            exit 1
          }
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if ($result.skipped) {
            # Clean exit, loud log: nothing was embedded and nothing is claimed.
            Write-Output "::warning::Embedding backfill SKIPPED - GOOGLE_GENERATIVE_AI_API_KEY is not set in production. 0 deals embedded."
            exit 0
          }
          if ($result.success -ne $true) {
            Write-Output "::error::Embedding backfill did not run successfully. Check the production provider configuration."
            exit 1
          }
          $c = $result.coverage
          if ($c) {
            Write-Output ("Coverage: {0}/{1} active deals embedded ({2}%); hash-verified fresh: {3}; missing: {4}" -f $c.embedded, $c.active, $c.pct, $c.fresh, $result.remaining)
          }
          Write-Output ("Updated {0} this run (missing {1}, changed {2}, legacy {3}); today {4}/{5}" -f $result.updated, $result.byTier.missing, $result.byTier.changed, $result.byTier.legacy, $result.budget.usedToday, $result.budget.dailyCap)
          if ($result.schemaReady -eq $false) {
            Write-Output "::warning::Freshness migration 20261009200000 not applied - running missing-only mode (no change detection)."
          }
          if ($result.quotaExhausted) {
            Write-Output "::warning::Gemini free-tier quota hit ($($result.quotaExhausted)) - stopped cleanly after $($result.updated) deals; resumes next run / after midnight PT."
          } elseif ($result.budgetExhausted) {
            Write-Output "::notice::Daily embedding cap reached ($($result.budget.dailyCap)/day) - nothing embedded this run; resumes after midnight PT."
          }

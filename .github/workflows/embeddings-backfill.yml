# Embeddings backfill — moved OFF Vercel cron.
#
# Why: vercel.json had 3 daily crons, but the Vercel Hobby plan allows a maximum of 2, so the
# third was rejected on deploy. The two alert jobs are user-facing (price drops, profit sniper)
# and must stay; this one is an incremental enrichment job (embed deals that lack a vector) and
# belongs on a scheduler that isn't rate-limited.
#
# The endpoint is unchanged: GET /api/embeddings/backfill is gated by isAuthorizedCron, which
# accepts `Authorization: Bearer <CRON_SECRET>` — the same header Vercel Cron sends, and the same
# one lib/cron-auth.ts documents for GitHub Actions.

name: Embeddings backfill

on:
  schedule:
    - cron: "0 10 * * *" # same 10:00 UTC slot it had as a Vercel cron
  workflow_dispatch: # manual re-run from the Actions tab
    inputs:
      limit:
        description: "Deals to embed this run (max 200)"
        required: false
        default: "100"

concurrency:
  group: embeddings-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - name: Trigger backfill
        # Zeus self-hosted runners are Windows services (NetworkService) with no WSL distro, so a
        # bare `shell: bash` resolves to WSL's bash.exe and dies. Built-in Windows PowerShell 5.1 +
        # curl.exe (ships with Windows 10+) needs nothing extra installed — same as ci.yml's `cmd`.
        shell: powershell
        env:
          # Production (repo homepage). Override with a SITE_URL repo secret if the domain changes.
          # Never point this at a per-deployment preview URL.
          BASE_URL: ${{ secrets.SITE_URL || 'https://mikehunt-69.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CRON_SECRET)) {
            Write-Output "::error::CRON_SECRET repo secret is not set - the endpoint fails closed with 401."
            exit 1
          }
          $base = $env:BASE_URL.TrimEnd('/')
          $out = Join-Path $env:RUNNER_TEMP 'backfill.json'
          Write-Output "Calling backfill on $base (limit=$($env:LIMIT))"
          $code = & curl.exe -sS -o $out -w "%{http_code}" --max-time 300 `
            -H "Authorization: Bearer $($env:CRON_SECRET)" `
            "$base/api/embeddings/backfill?limit=$($env:LIMIT)"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::curl failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Output "HTTP $code"
          if (Test-Path $out) { Get-Content $out -Raw | Write-Output }
          if ("$code".Trim() -ne '200') {
            Write-Output "::error::Backfill returned $code"
            exit 1
          }

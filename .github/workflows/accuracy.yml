name: Accuracy Regression Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # weekly on sunday

jobs:
  accuracy:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPECTED_SUPABASE_PROJECT_REF: qupzqpezslsbobhugswp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Zeus keeps npm's local cache; actions/cache cannot save its archive
          # from the Windows service account and only adds a false warning.
          package-manager-cache: false

      - name: Verify production database target
        run: node scripts/verify-supabase-target.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run valuation backtest accuracy gate
        run: npm run accuracy:gate
      - name: Cleanup workspace
        if: always()
        run: git clean -ffdx -e node_modules

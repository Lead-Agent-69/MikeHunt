name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Run npm audit
        run: npm audit --omit=dev
        continue-on-error: true

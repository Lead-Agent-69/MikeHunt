name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Zeus keeps npm's local cache; actions/cache cannot save its archive
          # from the Windows service account and only adds a false warning.
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: Cleanup workspace
        if: always()
        run: git clean -ffdx -e node_modules

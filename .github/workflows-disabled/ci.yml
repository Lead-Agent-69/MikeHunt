name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npx tsc --noEmit
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Run npm audit
        run: npm audit --omit=dev || true # Warns but does not fail the build
